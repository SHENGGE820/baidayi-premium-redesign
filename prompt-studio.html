<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 詢價 Prompt 工具｜百達醫 BKE</title>
  <meta name="description" content="將零散詢價文字放入固定的需求整理 Prompt，複製後貼入 ChatGPT 執行。">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#171713">
  <link rel="icon" href="wp-content/uploads/2025/09/BKE-favicon.png">
  <link rel="stylesheet" href="premium-site.css?v=20261007-02">
  <link rel="stylesheet" href="prompt-studio.css?v=20261007-01">
</head>
<body class="premium-site premium-inner prompt-studio-page" data-root="./">
  <a class="skip-link" href="#main-content">跳到主要內容</a>
  <div data-premium-header></div>
  <main id="main-content" class="prompt-studio">
    <header class="prompt-studio-heading">
      <p class="eyebrow">BKE / INQUIRY PROMPT</p>
      <h1>AI 詢價 Prompt 工具</h1>
      <p>貼上零散需求，產生 Prompt 後貼入 ChatGPT 執行。</p>
      <p class="prompt-studio-note">本頁只組合文字，不呼叫 AI 或傳送詢價內容；輸入不儲存在本站。</p>
    </header>
    <div class="prompt-studio-grid">
      <form id="prompt-form" class="prompt-studio-panel">
        <div class="prompt-studio-panel-heading">
          <label for="inquiry-text">1. 客戶詢價文字</label>
          <button id="load-example" class="prompt-studio-text-button" type="button">載入虛構範例</button>
        </div>
        <p id="inquiry-help" class="prompt-studio-help">配方、包裝或時程還沒決定，也可以保留「待確認」。貼入前先移除個資與機密內容。</p>
        <textarea id="inquiry-text" rows="13" maxlength="12000" autocomplete="off" spellcheck="false" aria-describedby="inquiry-help" placeholder="例如：想做粉包，每盒 30 包，先評估 3,000 盒。彩盒想燙金，但每包重量和盒子尺寸還沒決定。"></textarea>
        <div class="prompt-studio-actions">
          <button id="generate-prompt" class="button button-dark" type="submit">產生 Prompt</button>
          <button id="clear-prompt" class="prompt-studio-secondary" type="button">清空</button>
        </div>
      </form>
      <section class="prompt-studio-panel" aria-labelledby="prompt-output-title">
        <div class="prompt-studio-panel-heading">
          <label id="prompt-output-title" for="prompt-output">2. 可複製的完整 Prompt</label>
          <button id="copy-prompt" class="prompt-studio-secondary" type="button" disabled>複製 Prompt</button>
        </div>
        <p id="prompt-help" class="prompt-studio-help">輸出任務包含詢價表格、原文依據與待確認清單。正式價格與合規條件仍須人工核實。</p>
        <textarea id="prompt-output" rows="13" readonly spellcheck="false" aria-describedby="prompt-help" placeholder="產生後會出現在這裡。"></textarea>
        <p id="prompt-status" class="prompt-studio-status" role="status" aria-live="polite"></p>
      </section>
    </div>
    <p class="prompt-studio-footer-note">執行後先核對原文，再將已確認需求交給顧問。<a href="contact/index.html">前往代工諮詢 →</a>　<a href="demo.html">回成果展示入口</a></p>
    <noscript><p class="prompt-studio-status">請啟用 JavaScript 使用 Prompt 工具，或直接前往代工諮詢。</p></noscript>
  </main>
  <div data-premium-footer></div>
  <script src="premium-shell.js?v=20261007-02"></script>
  <script src="premium-site.js?v=20260929-03"></script>
  <script src="prompt-studio.js?v=20261007-01"></script>
</body>
</html>
