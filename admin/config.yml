  - name: settings
    label: 網站設定
    description: 公司電話、地址與頁尾簡介，會顯示在每一頁頁尾、代工諮詢頁與搜尋引擎資料。
    files:
      - name: company
        label: 公司資訊
        file: content/settings.md
        format: frontmatter
        fields:
          - { label: 電話, name: 電話, widget: string, hint: 例如 +886 2 8521 9269；網站會自動產生撥號連結與 02-8521-9269 的寫法。, pattern: ['^\+?[0-9][0-9 \-]{6,}$', '只能包含數字、空格、+ 和 -'] }
          - { label: 地址, name: 地址, widget: string, hint: 例如 新北市新莊區新北大道四段 187 號 15 樓 }
          - { label: 頁尾簡介, name: 頁尾簡介, widget: string, hint: 每一頁頁尾商標下方的一句話。 }
