</head><body><header><a class="brand" href="/index.html"><b>BKE</b> 百達醫</a><a href="/index.html">返回首頁</a></header><main><h1>搜尋網站</h1><form id="static-search"><input id="q" type="search" autocomplete="off" placeholder="輸入關鍵字"><button type="submit">搜尋</button></form><p class="status" id="status"></p><section id="results"></section></main><script src="/search-index.js"></script><script>(function(){var input=document.getElementById('q'),status=document.getElementById('status'),results=document.getElementById('results');function esc(s){return s.replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function run(){var query=input.value.trim();var terms=query.toLowerCase().split(/\s+/).filter(Boolean);results.innerHTML='';if(!terms.length){status.textContent='請輸入關鍵字';return}var matches=(window.BKE_SEARCH_INDEX||[]).filter(function(item){var hay=(item.title+' '+item.text).toLowerCase();return terms.every(function(term){return hay.includes(term)})});status.textContent='找到 '+matches.length+' 筆結果';matches.forEach(function(item){var excerpt=item.text.slice(0,160);results.insertAdjacentHTML('beforeend','<a class="result" href="'+esc(item.href)+'"><h2>'+esc(item.title)+'</h2><p>'+esc(excerpt)+'…</p></a>')})}document.getElementById('static-search').addEventListener('submit',function(e){e.preventDefault();run()});var q=new URLSearchParams(location.search).get('q')||'';input.value=q;if(q)run()})();</script><script src="./static-compat.js" defer></script><script src="premium-legacy.js"></script>
